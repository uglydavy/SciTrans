[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitrans"
version = "1.0.0"
description = "SciTrans-LLMs: Adaptive Document Translation Enhanced by Technology based on LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name="Franck Davy", email="aknk.v@pm.me"},
]
keywords = ["pdf", "translation", "llm", "scientific", "adaptive", "document-translation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.6.0",
  "mypy>=1.8",
  "types-requests",
]
viz = [
  "scikit-image>=0.24.0",
  "pillow>=10.0",
]
preview = [
  "pillow>=10.0",
]
thesis = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "seaborn>=0.12",
  "jinja2>=3.1.0",
]
backends = [
  "anthropic>=0.34.0",
  "openai>=1.0.0",
  "requests>=2.31.0",
  "huggingface-hub>=0.20.0",
  "deep-translator>=1.11.0",
  # googletrans==4.0.0rc1 is optional (has httpcore compatibility issues)
  # deep-translator is preferred as it's more reliable
]
gui = [
  "gradio>=5.0.0",
]
api = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
]
export = [
  "python-docx>=1.1.0",
]
security = [
  "cryptography>=41.0.0",
]
all = [
  "scitrans[dev,viz,backends,gui,thesis,api,export,security]",
]

[project.scripts]
scitrans = "scitrans.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP045"]  # UP045: Use Optional[X] for Python 3.9 compatibility (X | None requires 3.10+)

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:.*SwigPyPacked.*:DeprecationWarning",
    "ignore:.*SwigPyObject.*:DeprecationWarning",
    "ignore:.*swigvarlink.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
